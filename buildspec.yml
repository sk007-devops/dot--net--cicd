version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12

  pre_build:
    commands:
      - echo "Installing dependencies..."
      - pip install -r requirements.txt

  build:
    commands:
      - echo "Running unit tests..."
      - python -m unittest -v

  post_build:
    commands:
      - echo "Build completed successfully"