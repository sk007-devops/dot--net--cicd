name: Flask CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest -v

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/github-actions-flask-app:${{ github.run_number }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/github-actions-flask-app:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/github-actions-flask-app:${{ github.run_number }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/github-actions-flask-app:latest

      - name: Run container
        run: |
          docker run -d \
            --name flask-test \
            -p 5000:5000 \
            ${{ secrets.DOCKERHUB_USERNAME }}/github-actions-flask-app:${{ github.run_number }}

      - name: Verify application
        run: |
          sleep 5
          curl -f http://localhost:5000

      - name: Cleanup container
        if: always()
        run: docker rm -f flask-test || true
    deploy-to-kubernetes:
    needs: build-test-push
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Check Kubernetes
        shell: cmd
        run: kubectl get nodes

      - name: Restart Kubernetes deployment
        shell: cmd
        run: kubectl rollout restart deployment flask-app

      - name: Wait for deployment
        shell: cmd
        run: kubectl rollout status deployment flask-app --timeout=120s

      - name: Check pods
        shell: cmd
        run: kubectl get pods